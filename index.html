<!DOCTYPE html>
<html lang="en">
<head> <!-- elemento onde inserimos metadados sobre a página web -->
    <meta charset="UTF-8">
    <title>Minha Página Web</title>
</head>

<body> <!-- elemento onde colocamos todo o conteúdo que será exibido aos usuários -->
    <!-- tags de cabeçalho servem pra definir titulos e subtitulos -->
    <h1>This is a heading 1</h1>
    <h2>This is a heading 2</h2>
    <h3>This is a heading 3</h3>
    <h4>This is a heading 4</h4>
    <h5>This is a heading 5</h5>
    <h6>This is a heading 6</h6>

    <p>Paragráfo 1</p>
    <p>Paragráfo 2</p>
    <strong>Lorem ipsum dolor</strong>
    <p><strong>Paragráfo</strong> 3</p>
    <em>Texto em itálico</em>
    <p><em>Paragráfo</em> 4</p>

    <ul> <!-- Lista não ordenada -->
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>
</body>
</html>
